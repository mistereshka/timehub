<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A sunset tile in the colours of the music visuals with a white day-timeline mark:
       three blocks of the day, one after another. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8957e5"/>
      <stop offset="0.55" stop-color="#db61a2"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#tile)"/>
  <g fill="#ffffff">
    <rect x="232" y="248" width="328" height="128" rx="64"/>
    <rect x="348" y="448" width="328" height="128" rx="64"/>
    <rect x="464" y="648" width="328" height="128" rx="64"/>
  </g>
</svg>
